name: Auto-update VPN

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get fresh configs
        run: |
          curl -s "https://raw.githubusercontent.com/yebekhe/TelegramV2rayCollector/refs/heads/main/sub/normal" > vvvvv
          echo "# Updated: $(date)" >> vvvvv
      - name: Commit
        run: |
          git config user.name "Auto-Updater"
          git config user.email "auto@update.com"
          git add vvvvv
          git commit -m "Auto-update $(date)" || exit 0
          git push
